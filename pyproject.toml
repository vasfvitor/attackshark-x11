[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkx11"
version = "0.1.0b2"
description = "Open-source Linux and Windows configurator for the ATTACK SHARK X11 wireless mouse (CLI + GUI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Miguel Sanz" }]
keywords = ["attack shark", "x11", "mouse", "dpi", "linux", "windows", "hidraw", "hidapi", "configurator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Environment :: X11 Applications",
]

dependencies = [
    "hidapi>=0.14; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "Pillow>=10.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest", "coverage", "Pillow>=10.1"]

[project.scripts]
x11ctl = "sharkx11.cli:main"

[project.gui-scripts]
x11gui = "sharkx11.gui.app:main"
x11tray = "sharkx11.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
